<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="VeilChat app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#05070F"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed background (launcher icons must not be transparent) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="200" fill="url(#halo)"/>

  <!-- Simplified mark, scaled for small sizes: shield + veil arc + lock -->
  <g transform="translate(256,268) scale(0.86) translate(-256,-268)">
    <path
      d="M256 78 L392 130 C392 130 396 268 372 324 C348 380 296 412 256 430
         C216 412 164 380 140 324 C116 268 120 130 120 130 Z"
      fill="none" stroke="url(#mark)" stroke-width="26" stroke-linejoin="round"/>

    <path d="M152 192 C206 224 306 224 360 192"
          fill="none" stroke="url(#mark)" stroke-width="18"
          stroke-linecap="round" opacity="0.7"/>

    <path d="M224 296 L224 276 C224 258 238 244 256 244 C274 244 288 258 288 276 L288 296"
          fill="none" stroke="url(#mark)" stroke-width="20" stroke-linecap="round"/>
    <rect x="209" y="296" width="94" height="78" rx="20" fill="url(#mark)"/>
    <circle cx="256" cy="326" r="11" fill="#05070F"/>
    <rect x="250" y="332" width="12" height="24" rx="6" fill="#05070F"/>
  </g>
</svg>
